name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      # Trusted Publishing requires npm >= 11.5.1. Pinned to 11.x: npm 12+
      # hard-errors (EUNKNOWNCONFIG) on the pnpm-only flags/config it inherits
      # from .npmrc and changesets' publish invocation.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Runs `changeset version`, then stamps the bumped version into the
          # plugin manifests so they cannot drift behind package.json.
          version: pnpm run version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tags a consumer can put after `uses:`.
      #
      # changesets tags releases `specdx@0.4.0`, and GitHub parses
      # `owner/repo/path@ref` by splitting on the last `@` — so that tag can
      # never be referenced from a workflow. The README documented `@v0.4.0`,
      # which simply did not exist. `v<major>` moves so consumers can track a
      # major line, which is the convention for published actions.
      #
      # Runs only after a successful publish, so a failure here cannot affect
      # what reached npm.
      - name: Tag the action for `uses:` references
        if: steps.changesets.outputs.published == 'true'
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          case "$version" in
            *-*) echo "Prerelease $version — no moving tag."; exit 0 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v$version"
          git tag -f "v${version%%.*}"
          git push -f origin "v$version" "v${version%%.*}"

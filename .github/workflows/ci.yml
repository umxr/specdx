name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint:code
      - run: pnpm format:check
      - run: pnpm test
      # The plugin manifest and hooks schema are only validated by the Claude
      # Code CLI. A malformed hooks.json shipped undetected until this ran.
      - run: pnpm check-plugin-version

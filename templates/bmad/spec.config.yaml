version: "1.0"

project:
  name: "my-project"

specs:
  prd:
    path: "specs/prd.md"
    type: "prd"
    required: true
  technical:
    path: "specs/technical-design.md"
    type: "technical-design"
    requires: ["prd"]
  stories:
    path: "specs/stories/*.md"
    type: "user-story"
    requires: ["prd"]
  test-plan:
    path: "specs/test-plan.md"
    type: "test-plan"
    requires: ["prd"]
  adr:
    path: "specs/adr/*.md"
    type: "adr"

lint:
  extends: "recommended"
